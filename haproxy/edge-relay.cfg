global
    log stdout format raw local0
    maxconn 2048
    hard-stop-after 15s

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 2m
    timeout server 2m

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend public_http
    bind :8080
    default_backend nginx_http

backend nginx_http
    server nginx nginx:80 check resolvers docker init-addr last,libc,none

frontend public_https
    bind :8443
    default_backend nginx_https

backend nginx_https
    server nginx nginx:443 check resolvers docker init-addr last,libc,none
