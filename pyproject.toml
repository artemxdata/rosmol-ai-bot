[project]
name = "rosmol-ai-bot"
version = "0.1.0"
description = "RAG + LLM AI bot for Rosmolodezh forum and grants support"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "gigachat>=0.1.39.post1",
    "httpx>=0.27.0",
    "langchain-core>=0.2.23",
    "langgraph>=0.2.0",
    "loguru>=0.7.2",
    "natasha>=1.6.0",
    "numpy>=1.26.4",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "qdrant-client>=1.10.1,<1.12",
    "redis[hiredis]>=5.0.7",
    "structlog>=24.2.0",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
ml = [
    "FlagEmbedding>=1.2.10",
    "torch>=2.3.0",
]
dev = [
    "mypy>=1.10.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
