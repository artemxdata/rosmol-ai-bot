name: KB Offline Regression

on:
  push:
    paths:
      - "data/knowledge_base_seed.json"
      - "data/forums_registry.json"
      - "data/kb_source_corrections.json"
      - "data/golden_set.json"
      - "src/kb/**"
      - "src/rag/**"
      - "eval/**"
      - "scripts/audit_kb_seed.py"
      - "scripts/index_kb.py"
      - ".github/workflows/eval.yml"
  pull_request:
    paths:
      - "data/knowledge_base_seed.json"
      - "data/forums_registry.json"
      - "data/kb_source_corrections.json"
      - "data/golden_set.json"
      - "src/kb/**"
      - "src/rag/**"
      - "eval/**"
      - "scripts/audit_kb_seed.py"
      - "scripts/index_kb.py"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - name: Install dependencies
        run: |
          python -m venv --clear .ci-venv
          .ci-venv/bin/python -c "from importlib.metadata import version; assert version('pip') == '24.0'; assert version('setuptools') == '79.0.1'"
          .ci-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements/sdist-build-tools.lock
          .ci-venv/bin/python -c "from importlib.metadata import version; assert version('pip') == '26.1.2'; assert version('setuptools') == '83.0.0'"
          .ci-venv/bin/python -m pip install --require-hashes --no-deps --no-build-isolation --no-binary=docopt -r requirements/sdist-bootstrap.lock
          .ci-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Validate KB seed structure
        run: >-
          python scripts/index_kb.py
          --validate-only
          --forums-registry data/forums_registry.json
      - name: Audit semantic KB integrity
        run: >-
          python scripts/audit_kb_seed.py
          --forums-registry data/forums_registry.json
          --fail-on error
      # This is a deterministic calibration/regression gate, not an independent holdout score.
      - name: Validate versioned calibration labels
        run: >-
          python -m eval.validate_golden_set
          --golden eval/cases/pre_pilot_forums.json
          --kb-seed data/knowledge_base_seed.json
          --min-cases 10
          --allow-missing-reference-answer
          --output /tmp/pre_pilot_forums_validation.json
          --markdown /tmp/pre_pilot_forums_validation.md
      - name: Run reproducible offline retrieval calibration
        run: >-
          python -m eval.run_retrieval
          --golden eval/cases/pre_pilot_forums.json
          --kb-seed data/knowledge_base_seed.json
          --backend lexical
          --top-k 10
          --output /tmp/pre_pilot_forums_metrics.json
      - name: Check regression fail-closed
        run: >-
          python eval/check_regression.py
          --metrics /tmp/pre_pilot_forums_metrics.json
          --threshold 0.85
          --min-cases 10
