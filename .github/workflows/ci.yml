name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - name: Install dependencies
        run: |
          python -m venv --clear .ci-venv
          .ci-venv/bin/python -c "from importlib.metadata import version; assert version('pip') == '24.0'; assert version('setuptools') == '79.0.1'"
          .ci-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements/sdist-build-tools.lock
          .ci-venv/bin/python -c "from importlib.metadata import version; assert version('pip') == '26.1.2'; assert version('setuptools') == '83.0.0'"
          .ci-venv/bin/python -m pip install --require-hashes --no-deps --no-build-isolation --no-binary=docopt -r requirements/sdist-bootstrap.lock
          .ci-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
