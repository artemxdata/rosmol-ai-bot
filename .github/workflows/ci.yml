name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  RELEASE_GIT_SHA: ${{ github.sha }}

jobs:
  test:
    name: Secretless release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --platform linux/amd64 \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.28.0@sha256:bf00b5e039f0fad4b32935dc5ec1e358f227ccd097bcb64b971f0331072fe2ae \
            detect --source=/repo --redact --no-banner --exit-code=1 --log-opts=--all

      - name: Set up the release Python version
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"
          architecture: x64

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv --clear "$RUNNER_TEMP/rosmol-ci-venv"
          "$RUNNER_TEMP/rosmol-ci-venv/bin/python" -c "from importlib.metadata import version; assert version('pip') == '24.0'; assert version('setuptools') == '79.0.1'"
          "$RUNNER_TEMP/rosmol-ci-venv/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r requirements/sdist-build-tools.lock
          "$RUNNER_TEMP/rosmol-ci-venv/bin/python" -c "from importlib.metadata import version; assert version('pip') == '26.1.2'; assert version('setuptools') == '83.0.0'"
          "$RUNNER_TEMP/rosmol-ci-venv/bin/python" -m pip install --require-hashes --no-deps \
            --no-build-isolation --no-binary=docopt -r requirements/sdist-bootstrap.lock
          "$RUNNER_TEMP/rosmol-ci-venv/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r requirements/dev.lock
          echo "$RUNNER_TEMP/rosmol-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Smoke-test reproducible lock generation
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv --clear "$RUNNER_TEMP/rosmol-lock-smoke"
          "$RUNNER_TEMP/rosmol-lock-smoke/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements/lock-tools.lock
          "$RUNNER_TEMP/rosmol-lock-smoke/bin/python" -c \
            "from importlib.metadata import version; assert version('pip') == '26.1.2'; assert version('pip-tools') == '7.6.0'"
          printf 'packaging==26.2\n' > "$RUNNER_TEMP/rosmol-lock-smoke.in"
          "$RUNNER_TEMP/rosmol-lock-smoke/bin/pip-compile" \
            --dry-run --generate-hashes --resolver=backtracking --strip-extras --allow-unsafe \
            --output-file="$RUNNER_TEMP/rosmol-lock-smoke.lock" \
            "$RUNNER_TEMP/rosmol-lock-smoke.in"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -p no:cacheprovider -q

      - name: Compile durable HDE transport SQL against PostgreSQL
        shell: bash
        env:
          POSTGRES_USER: rosmol_ci
          POSTGRES_DB: rosmol_ai_bot_test
        run: |
          set -Eeuo pipefail
          export POSTGRES_PASSWORD="$(python -c 'import os; print(os.urandom(32).hex())')"
          export POSTGRES_DSN="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          export HDE_TRANSPORT_TEST_POSTGRES_DSN="$POSTGRES_DSN"
          cleanup() {
            docker compose -f docker-compose.yml down --volumes
          }
          trap cleanup EXIT
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 120 postgres
          python -m alembic upgrade head
          python -m pytest -p no:cacheprovider -q tests/test_hde_transport_postgres.py

      - name: Validate the frozen knowledge base
        run: python scripts/index_kb.py --validate-only

      - name: Validate production Compose without runtime secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e .env
          test ! -e .env.production
          production_compose="$RUNNER_TEMP/production-compose.json"
          acceptance_compose="$RUNNER_TEMP/acceptance-compose.json"
          compose_release_sha="0000000000000000000000000000000000000000"
          mkdir -p \
            "$RUNNER_TEMP/acceptance-source" \
            "$RUNNER_TEMP/acceptance-output" \
            "$RUNNER_TEMP/acceptance-provenance"
          printf '{}\n' > "$RUNNER_TEMP/acceptance-provenance/source-provenance.json"
          RELEASE_GIT_SHA="$compose_release_sha" \
          docker compose --env-file .env.production.example \
            -f docker-compose.yml \
            -f docker-compose.ml.yml \
            -f docker-compose.prod.yml \
            --profile ml \
            config --format json > "$production_compose"
          ACCEPTANCE_SOURCE_DIR="$RUNNER_TEMP/acceptance-source" \
          ACCEPTANCE_OUTPUT_DIR="$RUNNER_TEMP/acceptance-output" \
          ACCEPTANCE_PROVENANCE_DIR="$RUNNER_TEMP/acceptance-provenance" \
          RELEASE_GIT_SHA="$compose_release_sha" \
          docker compose --env-file .env.production.example \
            -f docker-compose.yml \
            -f docker-compose.ml.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.admin-tls.yml \
            -f docker-compose.acceptance.yml \
            --profile ml --profile tls --profile acceptance \
            config --format json > "$acceptance_compose"
          python - "$production_compose" "$acceptance_compose" "$compose_release_sha" <<'PY'
          import json
          import sys

          expected_release_sha = sys.argv[3]
          for compose_index, compose_path in enumerate(sys.argv[1:3]):
              payload = json.loads(open(compose_path, encoding="utf-8").read())
              services = payload["services"]
              networks = payload["networks"]
              app_ml = services["app-ml"]
              assert not app_ml.get("ports")
              assert set(app_ml["networks"]) == {"edge", "data", "runtime_egress"}
              assert all(networks[name]["internal"] is True for name in app_ml["networks"])
              published = {
                  name: service["ports"]
                  for name, service in services.items()
                  if service.get("ports")
              }
              assert set(published) == {"edge-relay"}
              edge_ports = sorted(
                  (
                      port["host_ip"],
                      str(port["published"]),
                      port["target"],
                      port["protocol"],
                  )
                  for port in published["edge-relay"]
              )
              assert edge_ports == [
                  ("0.0.0.0", "443", 8443, "tcp"),
                  ("0.0.0.0", "80", 8080, "tcp"),
              ]
              quality = services.get("quality-acceptance")
              if compose_index == 0:
                  assert quality is None
                  continue
              assert quality is not None
              assert not quality.get("ports")
              assert set(quality["networks"]) == {"data"}
              assert networks["data"]["internal"] is True
              assert quality["profiles"] == ["acceptance"]
              assert quality["user"] == "app"
              assert quality["read_only"] is True
              assert quality["restart"] == "no"
              assert quality["cap_drop"] == ["ALL"]
              assert quality["security_opt"] == ["no-new-privileges:true"]
              assert quality["tmpfs"] == [
                  "/tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777"
              ]
              environment = quality["environment"]
              assert set(environment) == {
                  "ALL_PROXY",
                  "API_AUTH_TOKEN",
                  "ASK_EVAL_POSTGRES_DSN",
                  "HTTP_PROXY",
                  "HTTPS_PROXY",
                  "NO_PROXY",
                  "PRE_PILOT_TRACE_REQUIRED",
                  "PYTHONDONTWRITEBYTECODE",
                  "PYTHONUNBUFFERED",
              }
              assert environment["PRE_PILOT_TRACE_REQUIRED"] == "1"
              assert all(
                  environment[name] == ""
                  for name in ("ALL_PROXY", "HTTP_PROXY", "HTTPS_PROXY")
              )
              assert environment["NO_PROXY"] == "app-ml,postgres,127.0.0.1,localhost"
              expected_image = f"rosmol-ai-bot-ml:{expected_release_sha}"
              assert quality["image"] == expected_image
              assert app_ml["image"] == expected_image
              mounts = {
                  volume["target"]: volume
                  for volume in quality["volumes"]
              }
              assert set(mounts) == {"/workspace", "/evidence", "/provenance"}
              assert mounts["/workspace"]["type"] == "bind"
              assert mounts["/workspace"]["read_only"] is True
              assert mounts["/provenance"]["type"] == "bind"
              assert mounts["/provenance"]["read_only"] is True
              assert mounts["/evidence"]["type"] == "bind"
              assert mounts["/evidence"].get("read_only") is not True
          PY

      - name: Confirm the checkout stayed clean
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)"
