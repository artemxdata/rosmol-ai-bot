name: rosmol-ai-bot

services:
  postgres:
    image: postgres:16-alpine
    container_name: rosmol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rosmol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosmol}
      POSTGRES_DB: ${POSTGRES_DB:-rosmol_ai_bot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rosmol} -d ${POSTGRES_DB:-rosmol_ai_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rosmol-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: rosmol-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: rosmol-ai-bot-app:latest
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: rosmol-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://rosmol:rosmol@postgres:5432/rosmol_ai_bot}
    depends_on:
      postgres:
        condition: service_healthy

  init-qdrant:
    image: rosmol-ai-bot-app:latest
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: rosmol-init-qdrant
    restart: "no"
    command: ["python", "scripts/init_qdrant.py"]
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_KNOWLEDGE_COLLECTION: ${QDRANT_KNOWLEDGE_COLLECTION:-knowledge_base}
    depends_on:
      qdrant:
        condition: service_healthy

  app:
    image: rosmol-ai-bot-app:latest
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: rosmol-app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      WEBHOOK_AUTH_TOKEN: ${WEBHOOK_AUTH_TOKEN:-}
      CLOUD_RU_API_KEY: ${CLOUD_RU_API_KEY:-}
      CLOUD_RU_CHAT_COMPLETIONS_URL: ${CLOUD_RU_CHAT_COMPLETIONS_URL:-https://foundation-models.api.cloud.ru/v1/chat/completions}
      CLOUD_RU_MODEL: ${CLOUD_RU_MODEL:-}
      CLOUD_RU_MODEL_SIMPLE: ${CLOUD_RU_MODEL_SIMPLE:-${CLOUD_RU_MODEL:-ai-sage/GigaChat3-10B-A1.8B}}
      CLOUD_RU_MODEL_COMPLEX: ${CLOUD_RU_MODEL_COMPLEX:-GigaChat/GigaChat-2-Max}
      CLOUD_RU_MODEL_ANALYZER: ${CLOUD_RU_MODEL_ANALYZER:-}
      CLOUD_RU_MODEL_JUDGE: ${CLOUD_RU_MODEL_JUDGE:-}
      CLOUD_RU_MODEL_SIMPLE_INPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_SIMPLE_INPUT_PRICE_RUB_PER_MILLION:-0}
      CLOUD_RU_MODEL_SIMPLE_OUTPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_SIMPLE_OUTPUT_PRICE_RUB_PER_MILLION:-0}
      CLOUD_RU_MODEL_COMPLEX_INPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_COMPLEX_INPUT_PRICE_RUB_PER_MILLION:-569.34}
      CLOUD_RU_MODEL_COMPLEX_OUTPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_COMPLEX_OUTPUT_PRICE_RUB_PER_MILLION:-569.34}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://rosmol:rosmol@postgres:5432/rosmol_ai_bot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_KNOWLEDGE_COLLECTION: ${QDRANT_KNOWLEDGE_COLLECTION:-knowledge_base}
      RERANKER_THRESHOLD_LOW: ${RERANKER_THRESHOLD_LOW:-0.4}
      RERANKER_THRESHOLD_HIGH: ${RERANKER_THRESHOLD_HIGH:-0.7}
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.95}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1.0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      RATE_LIMIT_MESSAGES: ${RATE_LIMIT_MESSAGES:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-300}
      MEMORY_TTL_DAYS: ${MEMORY_TTL_DAYS:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-45}
      ML_UNLOAD_AFTER_USE: ${ML_UNLOAD_AFTER_USE:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-qdrant:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: rosmol-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
