services:
  quality-acceptance:
    profiles: ["acceptance"]
    image: rosmol-ai-bot-ml:${RELEASE_GIT_SHA:?RELEASE_GIT_SHA is required}
    pull_policy: never
    platform: linux/amd64
    user: app
    working_dir: /workspace
    entrypoint: ["python", "-m", "eval.run_pre_pilot_quality_suite"]
    command: ["--help"]
    environment:
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN is required}
      ASK_EVAL_POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:?RELEASE_GIT_SHA is required}
      EVAL_COST_LEDGER_DIR: /cost-ledger
      CLOUD_RU_MODEL: ${CLOUD_RU_MODEL:-}
      CLOUD_RU_MODEL_SIMPLE: ${CLOUD_RU_MODEL_SIMPLE:-${CLOUD_RU_MODEL:-ai-sage/GigaChat3-10B-A1.8B}}
      CLOUD_RU_MODEL_COMPLEX: ${CLOUD_RU_MODEL_COMPLEX:-GigaChat/GigaChat-2-Max}
      CLOUD_RU_MODEL_ANALYZER: ${CLOUD_RU_MODEL_ANALYZER:-}
      CLOUD_RU_MODEL_JUDGE: ${CLOUD_RU_MODEL_JUDGE:-}
      CLOUD_RU_MODEL_SIMPLE_INPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_SIMPLE_INPUT_PRICE_RUB_PER_MILLION:-0}
      CLOUD_RU_MODEL_SIMPLE_OUTPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_SIMPLE_OUTPUT_PRICE_RUB_PER_MILLION:-0}
      CLOUD_RU_MODEL_COMPLEX_INPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_COMPLEX_INPUT_PRICE_RUB_PER_MILLION:-0}
      CLOUD_RU_MODEL_COMPLEX_OUTPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_COMPLEX_OUTPUT_PRICE_RUB_PER_MILLION:-0}
      PRE_PILOT_TRACE_REQUIRED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: app-ml,postgres,127.0.0.1,localhost
    volumes:
      - type: bind
        source: ${ACCEPTANCE_SOURCE_DIR:?ACCEPTANCE_SOURCE_DIR is required}
        target: /workspace
        read_only: true
      - type: bind
        source: ${ACCEPTANCE_OUTPUT_DIR:?ACCEPTANCE_OUTPUT_DIR is required}
        target: /evidence
      - type: bind
        source: ${ACCEPTANCE_PROVENANCE_DIR:?ACCEPTANCE_PROVENANCE_DIR is required}
        target: /provenance
        read_only: true
      - type: bind
        source: ${ACCEPTANCE_COST_LEDGER_DIR:?ACCEPTANCE_COST_LEDGER_DIR is required}
        target: /cost-ledger
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 256
