name: rosmol-ai-bot

x-offline-model-environment: &offline-model-environment
  BGE_M3_MODEL_PATH: /opt/models/bge-m3
  BGE_RERANKER_MODEL_PATH: /opt/models/bge-reranker-v2-m3
  HF_MODEL_LOCK_PATH: /app/deploy/huggingface_models.lock.json
  HF_MODEL_VERIFICATION_RECEIPT: /opt/models/.verified-models.json
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

services:
  ml-cache-init:
    profiles: ["ml"]
    image: rosmol-ai-bot-ml:dev
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: "true"
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-0000000000000000000000000000000000000000}
    container_name: rosmol-ml-cache-init
    restart: "no"
    user: root
    entrypoint: ["chown"]
    command:
      [
        "-R",
        "app:app",
        "/home/app/.cache/huggingface",
        "/home/app/.cache/torch",
        "/opt/models",
      ]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    # CHOWN alone cannot traverse useradd's 0700 /home/app after cap_drop=ALL.
    # DAC_OVERRIDE is limited to this one-shot, networkless cache initializer.
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - hf_cache:/home/app/.cache/huggingface
      - torch_cache:/home/app/.cache/torch
      - model_cache:/opt/models

  model-prefetch:
    profiles: ["ml"]
    image: rosmol-ai-bot-ml:dev
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: "true"
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-0000000000000000000000000000000000000000}
    container_name: rosmol-model-prefetch
    restart: "no"
    user: app
    entrypoint: ["python", "scripts/prefetch_huggingface_models.py"]
    command:
      [
        "--manifest",
        "deploy/huggingface_models.lock.json",
        "--output-root",
        "/opt/models",
      ]
    environment:
      HF_HOME: /tmp/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - model_cache:/opt/models
    depends_on:
      ml-cache-init:
        condition: service_completed_successfully

  app-ml:
    profiles: ["ml"]
    image: rosmol-ai-bot-ml:dev
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: "true"
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-0000000000000000000000000000000000000000}
    container_name: rosmol-app-ml
    restart: unless-stopped
    user: app
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *offline-model-environment
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      WEBHOOK_AUTH_TOKEN: ${WEBHOOK_AUTH_TOKEN:-}
      ADMIN_AUTH_TOKEN: ${ADMIN_AUTH_TOKEN:-}
      USER_HASH_SECRET: ${USER_HASH_SECRET:-}
      ADMIN_QUALITY_REPORT_PATH: ${ADMIN_QUALITY_REPORT_PATH:-reports/presentation_quality/presentation_quality_report.json}
      YONOTE_API_TOKEN: ${YONOTE_API_TOKEN:-}
      YONOTE_BASE_URL: ${YONOTE_BASE_URL:-https://rossmol.yonote.ru}
      YONOTE_SYNC_ENABLED: ${YONOTE_SYNC_ENABLED:-false}
      YONOTE_SYNC_MODE: ${YONOTE_SYNC_MODE:-manual}
      YONOTE_COLLECTION_NAMES: "${YONOTE_COLLECTION_NAMES:-Росмолодёжь: общее, структура, направления;Росмолодёжь: мероприятия}"
      YONOTE_REQUEST_TIMEOUT_SECONDS: ${YONOTE_REQUEST_TIMEOUT_SECONDS:-30}
      YONOTE_MAX_RETRIES: ${YONOTE_MAX_RETRIES:-2}
      YONOTE_MIN_REQUEST_INTERVAL_SECONDS: ${YONOTE_MIN_REQUEST_INTERVAL_SECONDS:-0.15}
      HDE_TRIGGER_PREFIX: ${HDE_TRIGGER_PREFIX:-}
      HDE_BASE_URL: ${HDE_BASE_URL:-}
      HDE_API_EMAIL: ${HDE_API_EMAIL:-}
      HDE_API_KEY: ${HDE_API_KEY:-}
      HDE_BOT_USER_ID: ${HDE_BOT_USER_ID:-}
      HDE_REQUEST_TIMEOUT_SECONDS: ${HDE_REQUEST_TIMEOUT_SECONDS:-20}
      HDE_RATE_LIMIT_RPM: ${HDE_RATE_LIMIT_RPM:-250}
      HDE_RATE_LIMIT_REMAINING_RESERVE: ${HDE_RATE_LIMIT_REMAINING_RESERVE:-30}
      HDE_RATE_LIMIT_BAN_SECONDS: ${HDE_RATE_LIMIT_BAN_SECONDS:-1200}
      HDE_TRANSPORT_ENABLED: ${HDE_TRANSPORT_ENABLED:-false}
      HDE_TRANSPORT_EVENT_KEY_SECRET: ${HDE_TRANSPORT_EVENT_KEY_SECRET:-}
      HDE_TRANSPORT_ENCRYPTION_KEY: ${HDE_TRANSPORT_ENCRYPTION_KEY:-}
      HDE_TRANSPORT_LEASE_TIMEOUT_SECONDS: ${HDE_TRANSPORT_LEASE_TIMEOUT_SECONDS:-420}
      HDE_TRANSPORT_RECOVERY_INTERVAL_SECONDS: ${HDE_TRANSPORT_RECOVERY_INTERVAL_SECONDS:-30}
      HDE_TRANSPORT_SHUTDOWN_TIMEOUT_SECONDS: ${HDE_TRANSPORT_SHUTDOWN_TIMEOUT_SECONDS:-420}
      HDE_TRANSPORT_QUEUE_STALE_AFTER_SECONDS: ${HDE_TRANSPORT_QUEUE_STALE_AFTER_SECONDS:-900}
      CLOUD_RU_API_KEY: ${CLOUD_RU_API_KEY:-}
      CLOUD_RU_CHAT_COMPLETIONS_URL: ${CLOUD_RU_CHAT_COMPLETIONS_URL:-https://foundation-models.api.cloud.ru/v1/chat/completions}
      CLOUD_RU_MODEL: ${CLOUD_RU_MODEL:-}
      CLOUD_RU_MODEL_SIMPLE: ${CLOUD_RU_MODEL_SIMPLE:-${CLOUD_RU_MODEL:-ai-sage/GigaChat3-10B-A1.8B}}
      CLOUD_RU_MODEL_COMPLEX: ${CLOUD_RU_MODEL_COMPLEX:-GigaChat/GigaChat-2-Max}
      CLOUD_RU_MODEL_ANALYZER: ${CLOUD_RU_MODEL_ANALYZER:-}
      CLOUD_RU_MODEL_JUDGE: ${CLOUD_RU_MODEL_JUDGE:-}
      CLOUD_RU_MODEL_SIMPLE_INPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_SIMPLE_INPUT_PRICE_RUB_PER_MILLION:-0}
      CLOUD_RU_MODEL_SIMPLE_OUTPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_SIMPLE_OUTPUT_PRICE_RUB_PER_MILLION:-0}
      CLOUD_RU_MODEL_COMPLEX_INPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_COMPLEX_INPUT_PRICE_RUB_PER_MILLION:-569.34}
      CLOUD_RU_MODEL_COMPLEX_OUTPUT_PRICE_RUB_PER_MILLION: ${CLOUD_RU_MODEL_COMPLEX_OUTPUT_PRICE_RUB_PER_MILLION:-569.34}
      CLOUD_RU_REQUEST_TIMEOUT_SECONDS: ${CLOUD_RU_REQUEST_TIMEOUT_SECONDS:-12}
      CLOUD_RU_MAX_RETRIES: ${CLOUD_RU_MAX_RETRIES:-2}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://rosmol:rosmol@postgres:5432/rosmol_ai_bot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_KNOWLEDGE_COLLECTION: ${QDRANT_KNOWLEDGE_COLLECTION:-knowledge_base}
      RERANKER_THRESHOLD_LOW: ${RERANKER_THRESHOLD_LOW:-0.4}
      RERANKER_THRESHOLD_HIGH: ${RERANKER_THRESHOLD_HIGH:-0.7}
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.95}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
      PROMPT_VERSION: ${PROMPT_VERSION:-pilot50-quality-v2}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      RATE_LIMIT_MESSAGES: ${RATE_LIMIT_MESSAGES:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-300}
      MEMORY_TTL_DAYS: ${MEMORY_TTL_DAYS:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-150}
      ML_UNLOAD_AFTER_USE: ${ML_UNLOAD_AFTER_USE:-false}
      ML_UNLOAD_EMBEDDER_AFTER_USE: ${ML_UNLOAD_EMBEDDER_AFTER_USE:-false}
      ML_UNLOAD_RERANKER_AFTER_USE: ${ML_UNLOAD_RERANKER_AFTER_USE:-false}
      ML_PREWARM_ON_STARTUP: ${ML_PREWARM_ON_STARTUP:-true}
      ML_PREWARM_TIMEOUT_SECONDS: ${ML_PREWARM_TIMEOUT_SECONDS:-180}
      RETRIEVAL_STRICT_FORUM_STOP_MIN_CHUNKS: ${RETRIEVAL_STRICT_FORUM_STOP_MIN_CHUNKS:-3}
      HF_HOME: /home/app/.cache/huggingface
      TORCH_HOME: /home/app/.cache/torch
    ports:
      - "127.0.0.1:${APP_ML_HOST_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
      - ./data/private/runtime:/app/data/private
      - hf_cache:/home/app/.cache/huggingface
      - torch_cache:/home/app/.cache/torch
      - model_cache:/opt/models:ro
    depends_on:
      ml-cache-init:
        condition: service_completed_successfully
      model-prefetch:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-qdrant:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).read()",
        ]
      start_period: 240s
      interval: 10s
      timeout: 5s
      retries: 6

  ml-check:
    profiles: ["ml"]
    image: rosmol-ai-bot-ml:dev
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: "true"
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-0000000000000000000000000000000000000000}
    user: app
    network_mode: none
    entrypoint: ["python", "scripts/check_ml_runtime.py"]
    command: []
    environment:
      <<: *offline-model-environment
      HF_HOME: /home/app/.cache/huggingface
      TORCH_HOME: /home/app/.cache/torch
    volumes:
      - hf_cache:/home/app/.cache/huggingface
      - torch_cache:/home/app/.cache/torch
      - model_cache:/opt/models:ro
    depends_on:
      ml-cache-init:
        condition: service_completed_successfully
      model-prefetch:
        condition: service_completed_successfully

  index-kb:
    profiles: ["ml"]
    image: rosmol-ai-bot-ml:dev
    build:
      context: .
      target: runtime
      args:
        INSTALL_ML: "true"
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-0000000000000000000000000000000000000000}
    user: app
    command:
      [
        "sh",
        "-eu",
        "-c",
        "python scripts/index_kb.py --path data/knowledge_base_seed.json --expected-seed-sha256 \"$${EXPECTED_KB_SEED_SHA256}\" --validate-only && python scripts/init_qdrant.py && python scripts/index_kb.py --path data/knowledge_base_seed.json --expected-seed-sha256 \"$${EXPECTED_KB_SEED_SHA256}\"",
      ]
    environment:
      <<: *offline-model-environment
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_KNOWLEDGE_COLLECTION: ${QDRANT_KNOWLEDGE_COLLECTION:-knowledge_base}
      EXPECTED_KB_SEED_SHA256: ${EXPECTED_KB_SEED_SHA256:-}
      HF_HOME: /home/app/.cache/huggingface
      TORCH_HOME: /home/app/.cache/torch
    volumes:
      - ./data/knowledge_base_seed.json:/app/data/knowledge_base_seed.json:ro
      - hf_cache:/home/app/.cache/huggingface
      - torch_cache:/home/app/.cache/torch
      - model_cache:/opt/models:ro
    depends_on:
      ml-cache-init:
        condition: service_completed_successfully
      model-prefetch:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy

  nginx:
    depends_on:
      app:
        condition: service_healthy
      app-ml:
        condition: service_healthy

volumes:
  hf_cache:
  torch_cache:
  model_cache:
